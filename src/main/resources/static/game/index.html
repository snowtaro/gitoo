<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝말잇기 게임</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 20px;
        }

        .current-word {
            background: #fff9c4;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }

        .messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .message {
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎮 끝말잇기</h2>

    <div class="current-word" id="currentWord">
        첫 단어를 입력하세요
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-row">
        <input id="wordInput" placeholder="단어 입력">
        <button onclick="sendWord()">전송</button>
    </div>
</div>

<script>
    /* =====================
       공통 유틸
    ===================== */
    function parseJwt(token) {
        try {
            const base64Url = token.split(".")[1];
            const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
            const json = decodeURIComponent(atob(base64).split("")
                .map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
                .join(""));
            return JSON.parse(json);
        } catch {
            return null;
        }
    }

    function getAuthToken() {
        return localStorage.getItem("accessToken");
    }

    /* =====================
       상태
    ===================== */
    let stompClient = null;
    let nickname = null;
    let roomId = null;

    /* =====================
       초기화
    ===================== */
    document.addEventListener("DOMContentLoaded", () => {
        // roomId는 로비에서 넘어올 때 붙여줌
        const params = new URLSearchParams(location.search);
        roomId = params.get("roomId");

        if (!roomId) {
            alert("roomId가 없습니다.");
            location.href = "/";
            return;
        }

        // JWT에서 nickname 추출
        const token = getAuthToken();
        const payload = token ? parseJwt(token) : null;
        nickname = payload?.nickname;

        if (!nickname) {
            alert("닉네임을 불러올 수 없습니다.");
            location.href = "/";
            return;
        }

        connectGameWs();
    });

    /* =====================
       WebSocket 연결
    ===================== */
    function connectGameWs() {
        const socket = new SockJS("/ws-wordchain");
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, () => {
            console.log("게임 WS 연결됨");

            // 게임 토픽 구독 (roomId 기준)
            stompClient.subscribe(`/topic/game/${roomId}`, (msg) => {
                const data = JSON.parse(msg.body);
                handleGameMessage(data);
            });

            // 서버에 참가 알림
            stompClient.send(`/app/game/${roomId}/join`, {}, JSON.stringify({
                nickname: nickname
            }));
        });
    }

    /* =====================
       메시지 처리
    ===================== */
    function handleGameMessage(data) {
        const messages = document.getElementById("messages");

        if (data.type === "WORD") {
            const div = document.createElement("div");
            div.className = "message";
            div.textContent = `${data.nickname}: ${data.word}`;
            messages.appendChild(div);

            messages.scrollTop = messages.scrollHeight;

            const lastChar = data.word[data.word.length - 1];
            document.getElementById("currentWord").textContent =
                `다음 단어: "${lastChar}"`;
        }

        if (data.type === "SYSTEM") {
            const div = document.createElement("div");
            div.className = "message";
            div.textContent = data.message;
            messages.appendChild(div);
        }
    }

    /* =====================
       단어 전송
    ===================== */
    function sendWord() {
        const input = document.getElementById("wordInput");
        const word = input.value.trim();
        if (!word) return;

        stompClient.send(`/app/game/${roomId}/word`, {}, JSON.stringify({
            nickname: nickname,
            word: word
        }));

        input.value = "";
    }
</script>

</body>
</html>
