<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 원탁의 끝말잇기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        /* 원탁 디자인 CSS (첫 번째 HTML에서 가져옴) */
        body {
            font-family: 'Pretendard', sans-serif;
            background: #1a1a1a;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .game-area {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-table {
            position: relative;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #2e7d32 0%, #1b5e20 100%);
            border-radius: 50%;
            border: 12px solid #5d4037;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 0 100px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .center-stage {
            width: 320px;
            text-align: center;
            z-index: 10;
        }

        .player-seat {
            position: absolute;
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            background: #eee;
            border-radius: 50%;
            border: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s;
        }

        .player-seat.active .avatar-circle {
            border-color: #fbc02d;
            transform: scale(1.2);
            box-shadow: 0 0 25px #fbc02d;
        }

        .player-name {
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .timer-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #4caf50;
            transition: width 0.1s linear;
        }

        .current-word {
            font-size: 2.2em;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            display: flex;
            gap: 5px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        .input-group button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .messages {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 280px;
            height: 220px;
            background: rgba(255, 255, 255, 0.12);
            /* 흰색 베이스로 밝게 */
            backdrop-filter: blur(10px);
            /* 블러 효과 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            overflow-y: auto;
            font-size: 13px;
            z-index: 20;
        }

        .message {
            margin-bottom: 8px;
            padding: 6px 8px;
            color: #ffffff;
            /* 완전히 흰색 텍스트 */
            line-height: 1.4;
        }

        .message.word {
            color: #fbc02d;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .game-over {
            color: #ff5252;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #turnInfo {
            color: #ddd;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="game-area">
        <!-- 대기 화면 -->
        <div id="waitingSection" style="text-align: center;">
            <h1 style="font-size: 4em;">🎲</h1>
            <p>게임 참여자를 기다리는 중...</p>
        </div>

        <!-- 게임 화면 -->
        <div id="gameSection" class="hidden">
            <div class="game-table">
                <!-- 플레이어들이 여기 배치됨 -->
                <div id="playersContainer"></div>

                <!-- 중앙 스테이지 -->
                <div class="center-stage">
                    <div id="turnInfo">게임 시작 대기</div>
                    <div class="current-word" id="currentWord">첫 단어 입력</div>

                    <div class="timer-container">
                        <div class="timer-bar" id="timerBar"></div>
                    </div>

                    <div id="gameOverMessage" class="game-over hidden">시간 초과!</div>

                    <div class="input-group">
                        <input type="text" id="wordInput" placeholder="단어 입력" maxlength="20">
                        <button onclick="sendWord()">전송</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="messages" id="messages"></div>
    <script src="../js/main.js"></script>
    <script>
        let stompClient = null;
        let timerInterval = null;
        const TIME_LIMIT = 15000;
        let timeLeft = TIME_LIMIT;
        let isGameRunning = false;
        let username = null;
        let turnOrder = [];
        let currentTurnIndex = 0;

        function parseJwt(token) {
            try {
                const base64Url = token.split(".")[1];
                const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
                const json = decodeURIComponent(atob(base64).split("")
                    .map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
                    .join(""));
                return JSON.parse(json);
            } catch (e) {
                return null;
            }
        }

        function getAuthToken() {
            return localStorage.getItem("accessToken");
        }

        function initUser() {
            const token = getAuthToken();
            const payload = token ? parseJwt(token) : null;
            username = payload?.nickname;

            if (!username) {
                alert("닉네임 정보를 불러올 수 없습니다.");
                location.href = "/";
            }
        }

        function getRoomId() {
            const params = new URLSearchParams(location.search);
            return params.get("roomId") || params.get("id");
        }

        function connect(roomId) {
            const socket = new SockJS('http://localhost:8080/ws-wordchain');
            stompClient = Stomp.over(socket);

            stompClient.connect({}, function (frame) {
                // 방 정보/시작 이벤트 채널
                stompClient.subscribe('/topic/rooms/' + roomId, function (message) {
                    const data = JSON.parse(message.body);
                    if (data.type === 'GAME_STARTED' && !isGameRunning) {
                        handleGameStart(data);
                    }
                });

                // 게임 이벤트 채널
                stompClient.subscribe('/topic/game/' + roomId, function (message) {
                    const data = JSON.parse(message.body);

                    if (data.type === 'GAME_STARTED' && !isGameRunning) {
                        handleGameStart(data);
                        return;
                    }

                    showMessage(data);
                });
            });
        }

        function handleGameStart(data) {
            // ✅ 두 번째 코드의 "재입장 시 남은 시간 반영" 로직 포함
            const elapsed = Date.now() - (data.turnStartedAtEpoch || Date.now());
            const remaining = TIME_LIMIT - elapsed;
            timeLeft = remaining > 0 ? remaining : TIME_LIMIT;

            turnOrder = data.turnOrder || [];
            currentTurnIndex = Math.max(0, turnOrder.indexOf(data.currentTurn));
            isGameRunning = true;

            document.getElementById('waitingSection').classList.add('hidden');
            document.getElementById('gameSection').classList.remove('hidden');
            document.getElementById('gameOverMessage').classList.add('hidden');

            // ✅ 마지막 단어 복구
            if (data.lastWord) {
                document.getElementById('currentWord').textContent = data.lastWord;
            } else {
                document.getElementById('currentWord').textContent = '첫 단어 입력';
            }

            displayTurnOrder();
            updateTurnDisplay();
            updateInputState();
            startTimer();
        }

        function displayTurnOrder() {
            const container = document.getElementById('playersContainer');
            container.innerHTML = '';

            const total = turnOrder.length;
            if (!total) return;

            const radius = 260;
            const myIdx = turnOrder.indexOf(username);

            // 내가 없을 수도 있으니 방어코드
            const safeMyIdx = myIdx >= 0 ? myIdx : 0;
            const angleOffset = 90 - (safeMyIdx * (360 / total));

            turnOrder.forEach((player, index) => {
                const angle = (index * (360 / total)) + angleOffset;
                const radian = angle * (Math.PI / 180);

                const x = radius * Math.cos(radian);
                const y = radius * Math.sin(radian);

                const seat = document.createElement('div');
                seat.className = `player-seat ${index === currentTurnIndex ? 'active' : ''}`;
                seat.id = `turn-player-${index}`;
                seat.style.left = `calc(50% + ${x}px)`;
                seat.style.top = `calc(50% + ${y}px)`;

                seat.innerHTML = `
                <div class="avatar-circle">${player === username ? '👤' : '🤖'}</div>
                <div class="player-name">${player}${player === username ? ' (나)' : ''}</div>
            `;

                container.appendChild(seat);
            });
        }

        function updateTurnDisplay() {
            if (!turnOrder.length) return;

            const currentPlayer = turnOrder[currentTurnIndex];
            const isMyTurn = currentPlayer === username;

            document.getElementById('turnInfo').textContent =
                isMyTurn ? '당신의 차례!' : `${currentPlayer}의 차례`;

            turnOrder.forEach((_, index) => {
                const seat = document.getElementById(`turn-player-${index}`);
                if (!seat) return;
                seat.classList.toggle('active', index === currentTurnIndex);
            });
        }

        function sendWord() {
            const wordInput = document.getElementById('wordInput');
            const word = wordInput.value.trim();

            if (!word || !stompClient) return;

            stompClient.send("/app/word", {}, JSON.stringify({
                roomId: getRoomId(),
                username,
                word,
                type: 'WORD'
            }));

            wordInput.value = '';
        }

        async function showMessage(message) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + String(message.type || '').toLowerCase();

            let displayMessage = message.message || '';

            if (message.type === 'WORD') {
                displayMessage = `${message.username}: ${message.word}`;

                // ✅ 턴/타이머 갱신
                if (turnOrder.length > 0) {
                    currentTurnIndex = (currentTurnIndex + 1) % turnOrder.length;
                }
                updateTurnDisplay();
                updateInputState();
                resetTimer();

                // ✅ 현재 단어 표시
                document.getElementById('currentWord').textContent = message.word;

                // 안내 문구
                const lastChar = message.word.charAt(message.word.length - 1);
                const nextPlayer = turnOrder[currentTurnIndex];
                const isMyTurn = nextPlayer === username;
                document.getElementById('turnInfo').textContent =
                    isMyTurn ? `당신 차례! "${lastChar}"로 시작` : `${nextPlayer}의 차례 · "${lastChar}"로 시작`;
            }

            // ✅ 백엔드 Java 기준: ELIMINATE 로 통일
            else if (message.type === 'ELIMINATION') {
                displayMessage = message.message || `${message.username}님이 시간 초과로 탈락했습니다!`;

                // 탈락자 UI 흐리게
                const eliminatedIndex = turnOrder.indexOf(message.username);
                if (eliminatedIndex !== -1) {
                    const seat = document.getElementById(`turn-player-${eliminatedIndex}`);
                    if (seat) seat.style.opacity = '0.3';

                    // 로컬 turnOrder에서도 제거 (턴 꼬임 방지)
                    const wasCurrent = (eliminatedIndex === currentTurnIndex);
                    turnOrder.splice(eliminatedIndex, 1);

                    if (turnOrder.length === 0) {
                        // 전원 탈락 같은 예외 상황 방어
                        isGameRunning = false;
                        clearInterval(timerInterval);
                        document.getElementById('wordInput').disabled = true;
                    } else {
                        if (eliminatedIndex < currentTurnIndex) {
                            currentTurnIndex -= 1;
                        } else if (wasCurrent) {
                            // 현재 턴 탈락이면 같은 인덱스가 다음 사람 자리
                            if (currentTurnIndex >= turnOrder.length) currentTurnIndex = 0;
                        }

                        // 좌석 다시 렌더링 (인덱스 재배열)
                        displayTurnOrder();
                        updateTurnDisplay();
                        updateInputState();
                        resetTimer();
                    }
                }
            }

            else if (message.type === 'GAME_OVER') {
                displayMessage = message.message || '게임 종료';
                isGameRunning = false;
                clearInterval(timerInterval);

                document.getElementById('wordInput').disabled = true;
                document.getElementById('gameOverMessage').textContent = displayMessage;
                document.getElementById('gameOverMessage').classList.remove('hidden');

                setTimeout(() => {
                    alert(displayMessage);
                    location.href = "/";
                }, 3000);
            }

            else if (message.type === 'ERROR') {
                // 서버 검증 실패 메시지
                displayMessage = message.message || '잘못된 입력입니다.';
                // 내 턴이면 입력창 다시 포커스
                updateInputState();
            }

            messageDiv.textContent = displayMessage;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateInputState() {
            const wordInput = document.getElementById('wordInput');

            if (!isGameRunning || turnOrder.length === 0) {
                wordInput.disabled = true;
                wordInput.placeholder = "대기 중...";
                return;
            }

            const isMyTurn = turnOrder[currentTurnIndex] === username;
            wordInput.disabled = !isMyTurn;

            if (isMyTurn) {
                wordInput.placeholder = "단어를 입력하세요!";
                wordInput.focus();
            } else {
                wordInput.placeholder = "대기 중...";
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft -= 100;
                updateTimerBar();

                if (timeLeft <= 0) {
                    handleGameOver();
                }
            }, 100);

            updateTimerBar(); // 시작 직후 즉시 반영
        }

        function resetTimer() {
            timeLeft = TIME_LIMIT;
            startTimer();
        }

        function updateTimerBar() {
            const percentage = Math.max(0, (timeLeft / TIME_LIMIT) * 100);
            const timerBar = document.getElementById('timerBar');
            timerBar.style.width = percentage + '%';

            if (percentage > 50) {
                timerBar.style.background = '#4caf50';
            } else if (percentage > 20) {
                timerBar.style.background = '#ff9800';
            } else {
                timerBar.style.background = '#f44336';
            }
        }

        function handleGameOver() {
            clearInterval(timerInterval);

            // 현재 턴인 사람만 서버로 "탈락" 알림 전송
            const currentPlayer = turnOrder[currentTurnIndex];

            if (currentPlayer === username && stompClient && isGameRunning) {
                console.log("⏳ 내 차례 시간 초과 → 서버에 탈락 전송");
                stompClient.send("/app/elimination", {}, JSON.stringify({
                    roomId: getRoomId(),
                    username: username,
                    type: 'ELIMINATION' // ✅ 백엔드 enum 맞춤
                }));
            } else {
                console.log(`⏳ ${currentPlayer} 시간 초과 처리 대기`);
            }
        }

        async function fetchGameState(roomId) {
            try {
                const res = await apiFetch(`/rooms/${roomId}/game-state`);
                const data = await res.json();
                return data;
            } catch (e) {
                console.error('❌ 게임 상태 조회 실패:', e);
                throw e;
            }
        }

        document.getElementById('wordInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendWord();
        });

        document.addEventListener("DOMContentLoaded", async () => {
            initUser();

            const roomId = getRoomId();
            if (!roomId) return;

            try {
                const state = await fetchGameState(roomId);

                if (state.started) {
                    handleGameStart({
                        turnOrder: state.turnOrder,
                        currentTurn: state.currentTurn,
                        lastWord: state.lastWord,
                        turnStartedAtEpoch: state.turnStartedAtEpoch
                    });

                    // 렌더 직후 입력상태 한번 더 보정
                    setTimeout(() => updateInputState(), 50);
                }

                connect(roomId);
            } catch (e) {
                connect(roomId);
            }
        });
    </script>
</body>

</html>
