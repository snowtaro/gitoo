<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 원탁의 끝말잇기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        /* 원탁 디자인 CSS (첫 번째 HTML에서 가져옴) */
        body {
            font-family: 'Pretendard', sans-serif;
            background: #1a1a1a;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .game-area {
            position: relative;
            width: 800px;
            height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-table {
            position: relative;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #2e7d32 0%, #1b5e20 100%);
            border-radius: 50%;
            border: 12px solid #5d4037;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 100px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .center-stage {
            width: 320px;
            text-align: center;
            z-index: 10;
        }

        .player-seat {
            position: absolute;
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.5s ease;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            background: #eee;
            border-radius: 50%;
            border: 4px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }

        .player-seat.active .avatar-circle {
            border-color: #fbc02d;
            transform: scale(1.2);
            box-shadow: 0 0 25px #fbc02d;
        }

        .player-name {
            margin-top: 8px;
            background: rgba(0,0,0,0.7);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
        }

        .timer-container {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #4caf50;
            transition: width 0.1s linear;
        }

        .current-word {
            font-size: 2.2em;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .input-group {
            display: flex;
            gap: 5px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        .input-group button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .messages {
            position: fixed;
            left: 20px;
            bottom: 20px;
            width: 280px;
            height: 220px;
            background: rgba(255, 255, 255, 0.12);  /* 흰색 베이스로 밝게 */
            backdrop-filter: blur(10px);  /* 블러 효과 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            overflow-y: auto;
            font-size: 13px;
            z-index: 20;
        }

        .message {
            margin-bottom: 8px;
            padding: 6px 8px;
            color: #ffffff;  /* 완전히 흰색 텍스트 */
            line-height: 1.4;
        }

        .message.word {
            color: #fbc02d;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        .game-over {
            color: #ff5252;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #turnInfo {
            color: #ddd;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="game-area">
    <!-- 대기 화면 -->
    <div id="waitingSection" style="text-align: center;">
        <h1 style="font-size: 4em;">🎲</h1>
        <p>게임 참여자를 기다리는 중...</p>
    </div>

    <!-- 게임 화면 -->
    <div id="gameSection" class="hidden">
        <div class="game-table">
            <!-- 플레이어들이 여기 배치됨 -->
            <div id="playersContainer"></div>

            <!-- 중앙 스테이지 -->
            <div class="center-stage">
                <div id="turnInfo">게임 시작 대기</div>
                <div class="current-word" id="currentWord">첫 단어 입력</div>

                <div class="timer-container">
                    <div class="timer-bar" id="timerBar"></div>
                </div>

                <div id="gameOverMessage" class="game-over hidden">시간 초과!</div>

                <div class="input-group">
                    <input type="text" id="wordInput" placeholder="단어 입력" maxlength="20">
                    <button onclick="sendWord()">전송</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="messages" id="messages"></div>
<script src="../js/main.js"></script>
<script>
    // 두 번째 HTML의 백엔드 로직 그대로 유지
    let stompClient = null;
    let timerInterval = null;
    const TIME_LIMIT = 15000;
    let timeLeft = TIME_LIMIT;
    let isGameRunning = false;
    let username = null;
    let turnOrder = [];
    let currentTurnIndex = 0;

    function parseJwt(token) {
        try {
            const base64Url = token.split(".")[1];
            const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
            const json = decodeURIComponent(atob(base64).split("")
                .map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
                .join(""));
            return JSON.parse(json);
        } catch (e) {
            return null;
        }
    }

    function getAuthToken() {
        return localStorage.getItem("accessToken");
    }

    function initUser() {
        const token = getAuthToken();
        const payload = token ? parseJwt(token) : null;
        username = payload?.nickname;
        if (!username) {
            alert("닉네임 정보를 불러올 수 없습니다.");
            location.href = "/";
        }
    }

    function getRoomId() {
        const params = new URLSearchParams(location.search);
        return params.get("roomId") || params.get("id");
    }

    function connect(roomId) {
        const socket = new SockJS('http://localhost:8080/ws-wordchain');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            stompClient.subscribe('/topic/rooms/' + roomId, function(message) {
                const data = JSON.parse(message.body);
                if (data.type === 'GAME_STARTED' && !isGameRunning) {
                    handleGameStart(data);
                }
            });

            stompClient.subscribe('/topic/game/' + roomId, function(message) {
                const data = JSON.parse(message.body);
                if (data.type === 'GAME_STARTED' && !isGameRunning) {
                    handleGameStart(data);
                    return;
                }
                showMessage(data);
            });
        });
    }

    function handleGameStart(data) {
        turnOrder = data.turnOrder || [];
        currentTurnIndex = Math.max(0, turnOrder.indexOf(data.currentTurn));
        isGameRunning = true;

        document.getElementById('waitingSection').classList.add('hidden');
        document.getElementById('gameSection').classList.remove('hidden');

        displayTurnOrder(); // 🔥 원형 배치 핵심 함수
        updateTurnDisplay();
        updateInputState();
        startTimer();
    }

    // 🎯 원형 배치 로직 (첫 번째 HTML에서 가져옴)
    function displayTurnOrder() {
        const container = document.getElementById('playersContainer');
        container.innerHTML = '';
        const radius = 260; // 반지름
        const total = turnOrder.length;

        // 본인을 아래(6시)에 배치하기 위한 각도 오프셋
        const myIdx = turnOrder.indexOf(username);
        const angleOffset = 90 - (myIdx * (360 / total));

        turnOrder.forEach((player, index) => {
            const angle = (index * (360 / total)) + angleOffset;
            const radian = angle * (Math.PI / 180);

            const x = radius * Math.cos(radian);
            const y = radius * Math.sin(radian);

            const seat = document.createElement('div');
            seat.className = `player-seat ${index === currentTurnIndex ? 'active' : ''}`;
            seat.id = `turn-player-${index}`;
            seat.style.left = `calc(50% + ${x}px)`;
            seat.style.top = `calc(50% + ${y}px)`;

            seat.innerHTML = `
                <div class="avatar-circle">${player === username ? '👤' : '🤖'}</div>
                <div class="player-name">${player}${player === username ? ' (나)' : ''}</div>
            `;
            container.appendChild(seat);
        });
    }

    function updateTurnDisplay() {
        const currentPlayer = turnOrder[currentTurnIndex];
        const isMyTurn = currentPlayer === username;

        document.getElementById('turnInfo').textContent =
            isMyTurn ? '당신의 차례!' : `${currentPlayer} 차례...`;

        turnOrder.forEach((_, index) => {
            const seat = document.getElementById(`turn-player-${index}`);
            if (seat) {
                if (index === currentTurnIndex) {
                    seat.classList.add('active');
                } else {
                    seat.classList.remove('active');
                }
            }
        });
    }

    function sendWord() {
        const wordInput = document.getElementById('wordInput');
        const word = wordInput.value.trim();
        if (word && stompClient) {
            stompClient.send("/app/word", {}, JSON.stringify({
                roomId: getRoomId(),
                username,
                word,
                type: 'WORD'
            }));
            wordInput.value = '';
        }
    }

    function showMessage(message) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' + message.type.toLowerCase();

        let displayMessage = message.message;

        if (message.type === 'WORD') {
            displayMessage = `${message.username}: ${message.word}`;
            currentTurnIndex = (currentTurnIndex + 1) % turnOrder.length;
            updateTurnDisplay();
            updateInputState();
            resetTimer();

            const lastChar = message.word.charAt(message.word.length - 1);
            document.getElementById('currentWord').textContent = message.word;
            document.getElementById('turnInfo').textContent = `다음: "${lastChar}"로 시작`;
        }

        messageDiv.textContent = displayMessage;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateInputState() {
        const wordInput = document.getElementById('wordInput');
        if (!isGameRunning || turnOrder.length === 0) return;

        const isMyTurn = turnOrder[currentTurnIndex] === username;
        wordInput.disabled = !isMyTurn;

        if (isMyTurn) {
            wordInput.placeholder = "단어를 입력하세요!";
            wordInput.focus();
        } else {
            wordInput.placeholder = "대기 중...";
        }
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timeLeft = TIME_LIMIT;

        timerInterval = setInterval(() => {
            timeLeft -= 100;
            updateTimerBar();
            if (timeLeft <= 0) handleGameOver();
        }, 100);
    }

    function resetTimer() {
        startTimer();
    }

    function updateTimerBar() {
        const percentage = (timeLeft / TIME_LIMIT) * 100;
        const timerBar = document.getElementById('timerBar');
        timerBar.style.width = percentage + '%';

        if (percentage > 50) {
            timerBar.style.background = '#4caf50';
        } else if (percentage > 20) {
            timerBar.style.background = '#ff9800';
        } else {
            timerBar.style.background = '#f44336';
        }
    }

    function handleGameOver() {
        clearInterval(timerInterval);
        isGameRunning = false;
        document.getElementById('wordInput').disabled = true;
        document.getElementById('gameOverMessage').classList.remove('hidden');
    }

    async function fetchGameState(roomId) {
        try {
            const res = await apiFetch(`/rooms/${roomId}/game-state`);
            console.log('📡 API 응답:', res);
            const data = await res.json();
            console.log('📦 게임 상태 데이터:', data);
            return data;
        } catch (e) {
            console.error('❌ 게임 상태 조회 실패:', e);
            throw e;
        }
    }

    document.getElementById('wordInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendWord();
    });

    document.addEventListener("DOMContentLoaded", async () => {
        initUser();
        const roomId = getRoomId();
        if (!roomId) return;

        try {
            const state = await fetchGameState(roomId);
            if (state.started) {
                handleGameStart({
                    turnOrder: state.turnOrder,
                    currentTurn: state.currentTurn
                });
            }
            connect(roomId);
        } catch (e) {
            connect(roomId);
        }
    });
</script>
</body>
</html>
