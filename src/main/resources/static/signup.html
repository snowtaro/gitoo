<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="icon" type="images/png" href="/images/favicon.ico">

    <style>
        :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        body { margin: 0; background: #f6f7fb; }

        .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.08);
            padding: 22px;
        }

        h1 { margin: 0 0 14px; font-size: 22px; }
        .sub { margin: 0 0 18px; color: #666; font-size: 14px; }

        label { display: block; font-size: 13px; margin: 12px 0 6px; color: #333; }

        input {
            width: 100%;
            padding: 12px 12px;
            border-radius: 10px;
            border: 1px solid #d8dbe6;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        input:focus { border-color: #6b7cff; box-shadow: 0 0 0 3px rgba(107,124,255,.15); }
        input[readonly] { background: #f3f4f6; color: #111827; cursor: not-allowed; }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            background: #111827;
            color: white;
            font-size: 14px;
        }
        button:disabled { opacity: .6; cursor: not-allowed; }

        .row { display: flex; gap: 10px; align-items: center; }
        .row > * { flex: 1; }
        .row button { flex: 0 0 110px; margin-top: 0; }

        .muted { color: #666; font-size: 13px; margin-top: 12px; }

        .msg {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
        }
        .msg.ok { background: #ecfdf5; color: #065f46; display: block; }
        .msg.err { background: #fef2f2; color: #991b1b; display: block; }

        a { color: #2563eb; text-decoration: none; }

        /* ===== Modal ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 999;
        }
        .overlay.open { display: flex; }

        .modal {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0,0,0,.18);
            overflow: hidden;
        }

        .modalHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
        }
        .modalHeader h2 { margin: 0; font-size: 16px; }

        .iconBtn {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .iconBtn:hover { background: #f3f4f6; }

        .modalBody { padding: 14px 16px 16px; }

        .modalRow { display: flex; gap: 10px; align-items: center; }
        .modalRow input { flex: 1; }
        .modalRow button { flex: 0 0 110px; margin-top: 0; background: #111827; }

        .hint { margin: 10px 0 0; color: #6b7280; font-size: 12px; }

        .results {
            margin-top: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            max-height: 320px;
            overflow-y: auto;
            display: none;
        }
        .resultItem {
            padding: 12px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }
        .resultItem:last-child { border-bottom: 0; }
        .resultItem:hover { background: #f8fafc; }

        .resultTitle { font-weight: 700; font-size: 14px; margin: 0 0 4px; }
        .resultMeta { margin: 0; font-size: 12px; color: #6b7280; line-height: 1.4; }

        .loading { font-size: 13px; color: #374151; margin-top: 12px; display:none; }
        .errBox {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #fef2f2;
            color: #991b1b;
            font-size: 13px;
            display:none;
        }
    </style>
</head>

<body>
<div class="wrap">
    <div class="card">
        <h1>회원가입</h1>
        <p class="sub">이메일/비밀번호/닉네임/학교로 가입합니다.</p>

        <form id="signupForm">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="6자 이상" />

            <label for="username">닉네임</label>
            <input id="username" name="username" type="text" autocomplete="nickname" required placeholder="닉네임을 입력하세요" />

            <!-- ✅ 학교 인증 추가 -->
            <label for="schoolName">학교</label>
            <div class="row">
                <input id="schoolName" name="schoolName" type="text" readonly placeholder="학교 찾기를 눌러 선택하세요" />
                <button id="openSchoolModalBtn" type="button">학교 찾기</button>
            </div>
            <input id="schoolKey" name="schoolKey" type="hidden" />

            <button id="submitBtn" type="submit">가입하고 로그인</button>

            <div id="message" class="msg"></div>
            <div class="muted">
                이미 계정이 있나요? <a href="main.html">로그인</a>
            </div>
        </form>
    </div>
</div>

<!-- ✅ 학교 찾기 모달 -->
<div id="schoolOverlay" class="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="schoolModalTitle">
        <div class="modalHeader">
            <h2 id="schoolModalTitle">학교 찾기</h2>
            <button id="closeSchoolModalBtn" class="iconBtn" type="button" aria-label="닫기">✕</button>
        </div>
        <div class="modalBody">
            <div class="modalRow">
                <input id="schoolQuery" type="text" placeholder="예: 동인고, 동래고" />
                <button id="searchSchoolBtn" type="button">검색</button>
            </div>
            <p class="hint">검색 결과에서 본인 학교를 클릭하면 자동으로 선택돼요.</p>

            <div id="schoolLoading" class="loading">검색 중...</div>
            <div id="schoolError" class="errBox"></div>
            <div id="schoolResults" class="results"></div>
        </div>
    </div>
</div>

<script src="js/signup.js"></script>
</body>
</html>
