<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <style>
        :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
        body { margin: 0; background: #f6f7fb; }
        .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,.08);
            padding: 22px;
        }
        h1 { margin: 0 0 14px; font-size: 22px; }
        .sub { margin: 0 0 18px; color: #666; font-size: 14px; }
        label { display: block; font-size: 13px; margin: 12px 0 6px; color: #333; }

        input {
            width: 100%;
            padding: 12px 12px;
            border-radius: 10px;
            border: 1px solid #d8dbe6;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        input:focus { border-color: #6b7cff; box-shadow: 0 0 0 3px rgba(107,124,255,.15); }
        input[readonly] { background: #f3f4f6; color: #111827; cursor: not-allowed; }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            background: #111827;
            color: white;
            font-size: 14px;
        }
        button:disabled { opacity: .6; cursor: not-allowed; }

        .row { display: flex; gap: 10px; align-items: center; }
        .row > * { flex: 1; }
        .row button { flex: 0 0 110px; margin-top: 0; }

        .muted { color: #666; font-size: 13px; margin-top: 12px; }
        .msg {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
        }
        .msg.ok { background: #ecfdf5; color: #065f46; display: block; }
        .msg.err { background: #fef2f2; color: #991b1b; display: block; }
        a { color: #2563eb; text-decoration: none; }
        .small { font-size: 12px; color: #777; margin-top: 8px; }

        /* ===== Modal ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 999;
        }
        .overlay.open { display: flex; }
        .modal {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 18px 40px rgba(0,0,0,.18);
            overflow: hidden;
        }
        .modalHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
        }
        .modalHeader h2 {
            margin: 0;
            font-size: 16px;
        }
        .iconBtn {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 6px 8px;
            border-radius: 8px;
        }
        .iconBtn:hover { background: #f3f4f6; }

        .modalBody { padding: 14px 16px 16px; }
        .modalRow { display: flex; gap: 10px; align-items: center; }
        .modalRow input { flex: 1; }
        .modalRow button {
            flex: 0 0 110px;
            margin-top: 0;
            background: #111827;
        }

        .hint { margin: 10px 0 0; color: #6b7280; font-size: 12px; }
        .results {
            margin-top: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            max-height: 320px;
            overflow-y: auto;
        }
        .resultItem {
            padding: 12px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }
        .resultItem:last-child { border-bottom: 0; }
        .resultItem:hover { background: #f8fafc; }

        .resultTitle { font-weight: 700; font-size: 14px; margin: 0 0 4px; }
        .resultMeta { margin: 0; font-size: 12px; color: #6b7280; line-height: 1.4; }

        .loading { font-size: 13px; color: #374151; margin-top: 12px; }
        .errBox { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #fef2f2; color: #991b1b; font-size: 13px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>회원가입</h1>
        <p class="sub">이메일/비밀번호/닉네임/학교로 가입합니다.</p>

        <form id="signupForm">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />

            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6"
                   placeholder="6자 이상" />

            <label for="username">닉네임</label>
            <input id="username" name="username" type="text" autocomplete="nickname" required
                   placeholder="닉네임을 입력하세요" />

            <!-- 학교 -->
            <label for="schoolName">학교</label>
            <div class="row">
                <input id="schoolName" name="schoolName" type="text" readonly placeholder="학교 찾기를 눌러 선택하세요" />
                <button id="openSchoolModalBtn" type="button">학교 찾기</button>
            </div>
            <!-- 서버로 보낼 학교 식별값 (선택 후 채워짐) -->
            <input id="schoolKey" name="schoolKey" type="hidden" />

            <button id="submitBtn" type="submit">가입하고 로그인</button>

            <div id="message" class="msg"></div>
            <div class="muted">
                이미 계정이 있나요? <a href="login.html">로그인</a>
            </div>
        </form>
    </div>
</div>

<!-- 학교 찾기 모달 -->
<div id="schoolOverlay" class="overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="schoolModalTitle">
        <div class="modalHeader">
            <h2 id="schoolModalTitle">학교 찾기</h2>
            <button id="closeSchoolModalBtn" class="iconBtn" type="button" aria-label="닫기">✕</button>
        </div>
        <div class="modalBody">
            <div class="modalRow">
                <input id="schoolQuery" type="text" placeholder="예: 동인고, 동래고" />
                <button id="searchSchoolBtn" type="button">검색</button>
            </div>
            <p class="hint">검색 결과에서 본인 학교를 클릭하면 자동으로 선택돼요.</p>

            <div id="schoolLoading" class="loading" style="display:none;">검색 중...</div>
            <div id="schoolError" class="errBox" style="display:none;"></div>

            <div id="schoolResults" class="results" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080";
    const SIGNUP_URL = `${API_BASE}/auth/signup`;

    // 학교 검색 엔드포인트(백엔드에서 나이스 호출해서 반환하는 API)
    // 예: GET /api/schools/search?q=한성고
    const SCHOOL_SEARCH_URL = `${API_BASE}/api/schools/search`;

    const form = document.getElementById("signupForm");
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("message");

    // 학교 UI 요소
    const openSchoolModalBtn = document.getElementById("openSchoolModalBtn");
    const closeSchoolModalBtn = document.getElementById("closeSchoolModalBtn");
    const overlay = document.getElementById("schoolOverlay");
    const schoolQuery = document.getElementById("schoolQuery");
    const searchSchoolBtn = document.getElementById("searchSchoolBtn");
    const resultsBox = document.getElementById("schoolResults");
    const loadingBox = document.getElementById("schoolLoading");
    const errorBox = document.getElementById("schoolError");
    const schoolNameInput = document.getElementById("schoolName");
    const schoolKeyInput = document.getElementById("schoolKey");

    function showMessage(text, ok) {
        msg.className = "msg " + (ok ? "ok" : "err");
        msg.textContent = text;
    }

    function openModal() {
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");
        errorBox.style.display = "none";
        resultsBox.style.display = "none";
        loadingBox.style.display = "none";
        // 검색어 포커스
        setTimeout(() => schoolQuery.focus(), 50);
    }

    function closeModal() {
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");
    }

    // overlay 클릭 시 닫기 (모달 바깥 영역)
    overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeModal();
    });

    // ESC로 닫기
    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
    });

    openSchoolModalBtn.addEventListener("click", openModal);
    closeSchoolModalBtn.addEventListener("click", closeModal);

    async function searchSchools(q) {
        const url = new URL(SCHOOL_SEARCH_URL);
        url.searchParams.set("q", q);

        const res = await fetch(url.toString(), {
            method: "GET",
            headers: { "Accept": "application/json" },
        });

        let data = null;
        try { data = await res.json(); } catch (_) {}

        if (!res.ok) {
            const detail = data?.message || data?.error || res.statusText;
            throw new Error(detail);
        }

        // 기대 응답 형태 예시(백엔드에서 이렇게 맞춰주면 좋음):
        // [
        //   {
        //     schoolName: "한성고등학교",
        //     address: "서울특별시 ...",
        //     schoolType: "고등학교",
        //     atptCode: "B10",
        //     schoolCode: "7010569",
        //     schoolKey: "B10:7010569"
        //   }
        // ]
        return Array.isArray(data) ? data : (data?.items ?? []);
    }

    function renderResults(items) {
        resultsBox.innerHTML = "";
        if (!items.length) {
            resultsBox.style.display = "block";
            resultsBox.innerHTML = `<div class="resultItem"><p class="resultTitle">검색 결과가 없어요</p>
        <p class="resultMeta">학교명을 더 정확히 입력해보세요. (예: ‘OO고등학교’)</p></div>`;
            return;
        }

        for (const it of items) {
            const title = it.schoolName || it.name || "(이름 없음)";
            const meta1 = [it.schoolType, it.address].filter(Boolean).join(" · ");
            const schoolKey = it.schoolKey || (it.atptCode && it.schoolCode ? `${it.atptCode}:${it.schoolCode}` : null);

            const div = document.createElement("div");
            div.className = "resultItem";
            div.innerHTML = `
        <p class="resultTitle">${escapeHtml(title)}</p>
        <p class="resultMeta">${escapeHtml(meta1 || "")}</p>
        <p class="resultMeta">${escapeHtml(schoolKey ? `코드: ${schoolKey}` : "")}</p>
      `;

            div.addEventListener("click", () => {
                if (!schoolKey) {
                    errorBox.textContent = "학교 식별 코드가 없어 선택할 수 없어요. (백엔드 응답을 확인해줘!)";
                    errorBox.style.display = "block";
                    return;
                }
                schoolNameInput.value = title;
                schoolKeyInput.value = schoolKey; // 가입 payload에 포함될 값
                closeModal();
            });

            resultsBox.appendChild(div);
        }
        resultsBox.style.display = "block";
    }

    function escapeHtml(str) {
        return String(str)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    searchSchoolBtn.addEventListener("click", async () => {
        const q = schoolQuery.value.trim();
        errorBox.style.display = "none";
        resultsBox.style.display = "none";

        if (q.length < 2) {
            errorBox.textContent = "학교명을 2글자 이상 입력해줘!";
            errorBox.style.display = "block";
            return;
        }

        loadingBox.style.display = "block";
        searchSchoolBtn.disabled = true;

        try {
            const items = await searchSchools(q);
            renderResults(items);
        } catch (e) {
            errorBox.textContent = e.message || "학교 검색 중 오류가 발생했습니다.";
            errorBox.style.display = "block";
        } finally {
            loadingBox.style.display = "none";
            searchSchoolBtn.disabled = false;
        }
    });

    // Enter로 검색
    schoolQuery.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            searchSchoolBtn.click();
        }
    });

    async function signup(payload) {
        const res = await fetch(SIGNUP_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
        });

        let data = null;
        try { data = await res.json(); } catch (_) {}

        if (!res.ok) {
            const detail = data?.message || data?.error || res.statusText;
            throw new Error(detail);
        }
        return data;
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        msg.className = "msg";
        msg.textContent = "";
        btn.disabled = true;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const username = document.getElementById("username").value.trim();
        const schoolKey = schoolKeyInput.value;

        if (!schoolKey) {
            showMessage("학교 찾기에서 학교를 먼저 선택해줘!", false);
            btn.disabled = false;
            return;
        }

        try {
            // 학교코드 포함해서 회원가입
            await signup({ email, password, username, schoolKey });

            showMessage("회원가입 완료! 로그인 페이지로 이동합니다.", true);

            setTimeout(() => {
                window.location.href = "login";
            }, 700);

        } catch (err) {
            showMessage(err.message || "요청 중 오류가 발생했습니다.", false);
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
